name = "klanservicehub-frontend"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[[services]]
binding = "BACKEND"
service = "klanservicehub-backend"

[observability]
enabled = true

[vars]
BACKEND_URL = "https://klanservicehub-backend.klanservicehub.workers.dev"
VITE_API_URL = "https://klanservicehub-backend.klanservicehub.workers.dev"
NEXT_PUBLIC_API_URL = "https://klanservicehub-backend.klanservicehub.workers.dev"
NEXT_PUBLIC_APP_BASE_URL = "https://klanservicehub-frontend.klanservicehub.workers.dev"
