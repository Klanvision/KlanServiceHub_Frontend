name = "klanservicehub-frontend"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
# Single Link: Points directly to your deployed Cloudflare Worker Backend API
VITE_API_URL = "https://klanservicehub-backend.klanservicehub.workers.dev"
NEXT_PUBLIC_API_URL = "https://klanservicehub-backend.klanservicehub.workers.dev"
NEXT_PUBLIC_APP_BASE_URL = "https://klanservicehub-frontend.pages.dev"
